<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Oshioxi — Full-stack development</title>
  <desc id="desc">Navy banner with cyan and violet accents. Thoughtful interfaces. Reliable deployment.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1100" cy="50" r="170" fill="#A78BFA" opacity=".06"/>
  <circle cx="1030" cy="240" r="190" fill="#22D3EE" opacity=".05"/>
  <rect x="64" y="57" width="48" height="5" rx="2.5" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="100" font-size="14" font-weight="600" letter-spacing="3" fill="#22D3EE">LEARN · BUILD · IMPROVE</text>
    <text x="60" y="178" font-size="68" font-weight="700" letter-spacing="-2" fill="#F8FAFC">Oshioxi</text>
    <text x="64" y="224" font-size="24" fill="#CBD5E1">Full-stack development</text>
    <text x="64" y="262" font-size="17" fill="#94A3B8">Thoughtful interfaces. Reliable deployment.</text>
  </g>
  <g transform="translate(920 96)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
    <path d="M38 30L0 64L38 98" stroke="#22D3EE"/>
    <path d="M126 30L164 64L126 98" stroke="#A78BFA"/>
    <path d="M99 10L66 118" stroke="url(#accent)"/>
  </g>
  <rect x="64" y="300" width="1072" height="2" rx="1" fill="url(#accent)" opacity=".65"/>
</svg>
